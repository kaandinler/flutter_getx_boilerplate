name: getx_boilerplate
version: 1.0.1+2
publish_to: none
description: A new Flutter project.
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.6
  get: ^4.7.2
  flutter_native_splash: ^2.3.10
  flutter:
    sdk: flutter
  new_version_plus: ^0.1.1
  flutter_secure_storage: ^9.0.0
  get_storage: ^2.1.1
  flutter_dotenv: ^6.0.0


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/env/.env
    - assets/env/.env.dev
    - assets/env/.env.qa
    - assets/env/.env.prod
    - assets/certs/

# Launcher icons configuration
# Requires: flutter_launcher_icons (already in dev_dependencies)
# Put your 1024x1024 PNG at assets/icons/app_icon.png before running:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21

# Native splash configuration
# Requires: flutter_native_splash (already in dependencies)
# To generate splash assets, run:
#   flutter pub run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false
  fullscreen: true

  # Light theme background
  color: "#FFFFFF"
  # Optional center image (uncomment and provide asset to show an icon)
  # image: assets/splash/splash_icon.png

  # Dark theme background
  color_dark: "#121212"
  # Optional dark image
  # image_dark: assets/splash/splash_icon_dark.png

  android_12:
    # Android 12+ requires explicit colors; images are optional
    color: "#FFFFFF"
    color_dark: "#121212"
    # Optional Android 12 specific assets
    # image: assets/splash/android12_splash_icon.png
    # image_dark: assets/splash/android12_splash_icon_dark.png

